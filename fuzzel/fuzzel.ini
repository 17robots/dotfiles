[border]
width = 1
radius = 20

[colors]
background=16121722
text=e9e0e8ff
selection=4b454ddd
selection-text=cdc3ceff
border=4b45ddd
match=dfb8f6ff
selection-match=dfb8f6ff

[dmenu]
exit-immediately-if-empty=yes

[key-bindings]
delete-line-forward=none
next=Down Control+j
prev=Down Control+k
next=Down Shift+j
prev=Down Shift+k

[main]
font = monospace:size=10
icons-enabled=false
prompt=''
dpi-aware=no
use-bold=false
inner-pad=5
vertical-pad=10
horizontal-pad=10
minimal-lines=true
lines=1
